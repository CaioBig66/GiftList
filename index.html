<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus Presentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#7c4dff;--pd:#5a2fd6;--ink:#2a1a55;--muted:#85799f;--lav:#f4efff;--lav2:#faf8ff;--line:#e8e0fb;
--head:"Fredoka","Nunito",system-ui,sans-serif;--body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html{font-size:17.5px}
body{margin:0;background:#fff;color:var(--ink);font-family:var(--body);line-height:1.5}
button,input,select,textarea{font:inherit}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
.side{background:var(--lav2);border-right:1px solid var(--line);padding:28px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px;overflow:auto}
.brand{font-family:var(--head);font-weight:700;font-size:1.6rem;color:var(--p);display:flex;gap:10px;align-items:center}
#tabs{display:flex;flex-direction:column;gap:8px}
.tab{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);padding:13px 18px;border-radius:999px;cursor:pointer;text-align:left;font-weight:700}
.tab:hover{background:var(--lav)}
.tab.on{background:var(--p);color:#fff;box-shadow:0 10px 20px rgba(124,77,255,.3)}
.tab small{background:rgba(124,77,255,.14);color:var(--pd);border-radius:999px;padding:1px 11px;font-weight:800;font-size:.85rem}
.tab.on small{background:rgba(255,255,255,.28);color:#fff}
.newlist{border:2px dashed #c9b8f5;background:transparent;color:var(--p);padding:12px;border-radius:999px;cursor:pointer;font-weight:800}
.newlist:hover{background:var(--lav)}
main{padding:36px clamp(18px,4vw,52px) 100px;max-width:1150px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{font-family:var(--head);font-weight:700;font-size:clamp(2.1rem,4.5vw,3rem);line-height:1.1;margin:0}
.sub{color:var(--muted);margin:8px 0 0;font-weight:600}
.btn{background:var(--p);color:#fff;border:0;padding:14px 26px;border-radius:999px;cursor:pointer;font-weight:800;box-shadow:0 10px 20px rgba(124,77,255,.28)}
.btn:hover{background:var(--pd)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--lav)}
.btn.danger{color:#c2255c}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}
.stat{background:var(--lav);border-radius:26px;padding:16px 22px}
.stat b{display:block;font-family:var(--head);font-size:1.9rem;color:var(--pd);font-weight:600}
.stat span{color:var(--muted);font-size:.9rem;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.card{background:#fff;border:2px solid var(--line);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 12px 30px rgba(124,77,255,.08);cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(124,77,255,.16)}
.ph{position:relative;aspect-ratio:1/1;background:var(--lav);display:flex;align-items:center;justify-content:center;font-size:3.4rem}
.ph img{width:100%;height:100%;object-fit:contain;background:#fff}
.got .ph img{filter:grayscale(1);opacity:.55}
.pill{position:absolute;font-weight:800;border-radius:999px;padding:5px 14px;font-size:.85rem}
.pill.price{left:14px;bottom:14px;background:var(--p);color:#fff;font-size:1.02rem}
.pill.star{right:14px;top:14px;background:#fff;color:var(--pd);box-shadow:0 4px 12px rgba(42,26,85,.14)}
.pill.done{left:14px;top:14px;background:var(--ink);color:#fff}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:9px;flex:1}
.name{font-family:var(--head);font-weight:600;font-size:1.12rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--lav);border-radius:999px;padding:3px 12px;font-size:.82rem;color:var(--pd);font-weight:700}
.hint{color:var(--muted);font-size:.85rem;font-weight:600}
.act{display:flex;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.act a{font-size:.9rem;padding:9px 18px;border-radius:999px;background:var(--p);color:#fff;text-decoration:none;font-weight:800}
.act a:hover{background:var(--pd)}
.empty{text-align:center;color:var(--muted);padding:60px 16px;border:2px dashed #d6c9f7;border-radius:30px;background:var(--lav2);font-weight:600}
dialog{border:0;border-radius:32px;padding:0;background:#fff;color:var(--ink);width:min(500px,94vw);max-height:92vh;box-shadow:0 30px 80px rgba(42,26,85,.3)}
dialog::backdrop{background:rgba(42,26,85,.5)}
form{padding:26px;display:flex;flex-direction:column;gap:14px}
form h2,.det h2{margin:0;font-family:var(--head);font-weight:600;font-size:1.55rem;line-height:1.2}
label{font-size:.9rem;color:var(--muted);display:flex;flex-direction:column;gap:6px;font-weight:700}
input,select,textarea{padding:12px 16px;border-radius:18px;border:2px solid var(--line);background:var(--lav2);color:var(--ink);width:100%;font-weight:600}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(124,77,255,.35);border-color:var(--p);background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.linkrow{display:flex;gap:8px}
.linkrow .btn{padding:11px 20px;white-space:nowrap;box-shadow:none}
.status{font-size:.9rem;color:var(--muted);min-height:1.2em;font-weight:600}
.status.err{color:#c2255c}
.prev{width:100%;max-height:190px;object-fit:contain;border-radius:20px;background:var(--lav);display:none}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.det{padding:0 0 24px}
.det .big{aspect-ratio:4/3;background:var(--lav);display:flex;align-items:center;justify-content:center;font-size:4rem}
.det .big img{width:100%;height:100%;object-fit:contain;background:#fff}
.det .in{padding:20px 26px 0;display:flex;flex-direction:column;gap:14px}
.det .pr{font-family:var(--head);font-size:1.8rem;color:var(--p);font-weight:600}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info div{background:var(--lav);border-radius:20px;padding:10px 16px}
.info small{display:block;color:var(--muted);font-weight:700;font-size:.78rem}
.info b{font-weight:800}
.blk h3{margin:0 0 4px;font-family:var(--head);font-weight:600;font-size:1.05rem;color:var(--pd)}
.blk p{margin:0;white-space:pre-wrap;color:var(--ink);font-weight:500}
.dact{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.dact .btn{padding:11px 20px;box-shadow:none;text-decoration:none;font-size:.92rem}
.x{position:absolute;right:14px;top:14px;width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:var(--ink);font-size:1.3rem;cursor:pointer;box-shadow:0 4px 14px rgba(42,26,85,.2);z-index:2}
@media (max-width:820px){
 html{font-size:16.5px}
 .app{grid-template-columns:1fr}
 .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px 14px;overflow:visible}
 #tabs{flex-direction:row;overflow-x:auto;padding-bottom:4px}
 .tab{white-space:nowrap}
 .newlist{align-self:flex-start;padding:9px 18px}
 .stat{padding:12px 14px}.stat b{font-size:1.3rem}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">🎁 Meus Presentes</div>
    <nav id="tabs"></nav>
    <button class="newlist" id="newlist">+ Nova lista</button>
  </aside>
  <main>
    <div class="head">
      <div><h1 id="lt"></h1><p class="sub">Cole o link e a foto, o nome, a descrição e o preço entram sozinhos.</p></div>
      <button class="btn" id="add">+ Adicionar presente</button>
    </div>
    <div class="stats" id="stats"></div>
    <div id="list"></div>
  </main>
</div>

<dialog id="dlg">
  <form onsubmit="return false">
    <h2 id="ttl">Novo presente</h2>
    <label>Link do produto
      <div class="linkrow">
        <input id="link" type="url" placeholder="Cole o link aqui">
        <button type="button" class="btn" id="fetch">Buscar</button>
      </div>
    </label>
    <div class="status" id="status"></div>
    <img class="prev" id="prev" alt="">
    <label>Nome do presente *<input id="name" placeholder="Preenchido automaticamente"></label>
    <label>Descrição do produto<textarea id="desc" rows="3" placeholder="Preenchida automaticamente, se o site permitir"></textarea></label>
    <div class="row">
      <label>Preço (R$)<input id="price" type="number" min="0" step="0.01" inputmode="decimal"></label>
      <label>Loja<input id="store" placeholder="Ex.: Amazon"></label>
    </div>
    <div class="row">
      <label>Tamanho, cor ou modelo<input id="variant" placeholder="Ex.: M, preto"></label>
      <label>Prioridade
        <select id="prio"><option value="3">⭐⭐⭐ Quero muito</option><option value="2" selected>⭐⭐ Legal ter</option><option value="1">⭐ Se sobrar</option></select>
      </label>
    </div>
    <label>Minhas observações<textarea id="notes" rows="2" placeholder="Qualquer detalhe que ajude quem for comprar"></textarea></label>
    <label>Trocar foto (opcional)<input id="photo" type="file" accept="image/*"></label>
    <div class="foot">
      <button type="button" class="btn ghost" id="cancel">Cancelar</button>
      <button type="button" class="btn" id="save">Salvar</button>
    </div>
  </form>
</dialog>

<dialog id="ddlg"><div class="det" id="det"></div></dialog>

<dialog id="ldlg">
  <form onsubmit="return false">
    <h2>Nova lista</h2>
    <label>Nome da lista<input id="lname" placeholder="Ex.: Dia dos Namorados"></label>
    <label>Emoji<input id="lemoji" value="🎁" maxlength="4"></label>
    <div class="foot">
      <button type="button" class="btn ghost" id="lcancel">Cancelar</button>
      <button type="button" class="btn" id="lsave">Criar lista</button>
    </div>
  </form>
</dialog>

<script>
var KEY='gift-lists-v2', S=null;
function $(id){return document.getElementById(id)}
function uid(){return Math.random().toString(36).slice(2,10)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
var PRIO={1:'Se sobrar',2:'Legal ter',3:'Quero muito'};
function load(){
  try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
  if(!S||!S.lists){S={active:null,lists:[
    {id:uid(),name:'Aniversário',emoji:'🎂',items:[]},
    {id:uid(),name:'Aniversário de namoro',emoji:'💕',items:[]},
    {id:uid(),name:'Natal',emoji:'🎄',items:[]}]};S.active=S.lists[0].id}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Armazenamento cheio. Use fotos menores.')}}
function cur(){return S.lists.find(function(l){return l.id===S.active})||S.lists[0]}
function imgTag(i,cls){return i.photo?'<img src="'+esc(i.photo)+'" alt="" referrerpolicy="no-referrer" onerror="this.outerHTML=\'🎁\'">':'🎁'}

function render(){
  var L=cur();S.active=L.id;
  $('tabs').innerHTML=S.lists.map(function(l){return '<button class="tab'+(l.id===L.id?' on':'')+'" data-id="'+l.id+'"><span>'+esc(l.emoji)+' '+esc(l.name)+'</span><small>'+l.items.length+'</small></button>'}).join('');
  $('lt').textContent=L.emoji+' '+L.name;
  var open=L.items.filter(function(i){return !i.got});
  var total=open.reduce(function(a,i){return a+(Number(i.price)||0)},0);
  $('stats').innerHTML='<div class="stat"><b>'+L.items.length+'</b><span>presentes</span></div><div class="stat"><b>'+open.length+'</b><span>faltando ganhar</span></div><div class="stat"><b>'+money(total)+'</b><span>valor do que falta</span></div>';
  var items=L.items.slice().sort(function(a,b){return (a.got-b.got)||(b.prio-a.prio)});
  if(!items.length){$('list').innerHTML='<div class="empty">Nenhum presente em “'+esc(L.name)+'” ainda.<br>Clique em “Adicionar presente” e cole um link.</div>';return}
  $('list').innerHTML='<div class="grid">'+items.map(function(i){
    return '<div class="card'+(i.got?' got':'')+'" data-id="'+i.id+'"><div class="ph">'+imgTag(i)
    +(i.price?'<span class="pill price">'+money(i.price)+'</span>':'')+'<span class="pill star">'+'⭐'.repeat(i.prio)+'</span>'+(i.got?'<span class="pill done">Já ganhei</span>':'')+'</div><div class="body">'
    +'<div class="name">'+esc(i.name)+'</div>'
    +((i.store||i.variant)?'<div class="meta">'+(i.store?'<span class="chip">'+esc(i.store)+'</span>':'')+(i.variant?'<span class="chip">'+esc(i.variant)+'</span>':'')+'</div>':'')
    +'<div class="hint">Toque no card para ver os detalhes</div>'
    +'<div class="act">'+(i.link?'<a href="'+esc(i.link)+'" target="_blank" rel="noopener noreferrer">Ver produto</a>':'')+'</div></div></div>'}).join('')+'</div>';
}

function findItem(id){return cur().items.find(function(x){return x.id===id})}
function openDetails(id){
  var i=findItem(id);if(!i)return;
  var info='';
  if(i.variant)info+='<div><small>Tamanho, cor ou modelo</small><b>'+esc(i.variant)+'</b></div>';
  if(i.store)info+='<div><small>Loja</small><b>'+esc(i.store)+'</b></div>';
  info+='<div><small>Prioridade</small><b>'+'⭐'.repeat(i.prio)+' '+PRIO[i.prio]+'</b></div>';
  info+='<div><small>Situação</small><b>'+(i.got?'Já ganhei':'Ainda quero')+'</b></div>';
  $('det').innerHTML='<div style="position:relative"><button class="x" data-d="close" aria-label="Fechar">✕</button><div class="big">'+imgTag(i)+'</div></div><div class="in">'
    +'<h2>'+esc(i.name)+'</h2>'+(i.price?'<div class="pr">'+money(i.price)+'</div>':'')
    +'<div class="info">'+info+'</div>'
    +(i.notes?'<div class="blk"><h3>Minhas observações</h3><p>'+esc(i.notes)+'</p></div>':'')
    +(i.desc?'<div class="blk"><h3>Sobre o produto</h3><p>'+esc(i.desc)+'</p></div>':'')
    +'<div class="dact">'+(i.link?'<a class="btn" href="'+esc(i.link)+'" target="_blank" rel="noopener noreferrer">Ir para a loja</a>':'')
    +'<button class="btn ghost" data-d="got" data-id="'+i.id+'">'+(i.got?'Desmarcar':'Já ganhei')+'</button>'
    +'<button class="btn ghost" data-d="edit" data-id="'+i.id+'">Editar</button>'
    +'<button class="btn ghost danger" data-d="del" data-id="'+i.id+'">Excluir</button></div></div>';
  $('ddlg').showModal();
}
$('det').addEventListener('click',function(e){
  var b=e.target.closest('button[data-d]');if(!b)return;
  var a=b.dataset.d,i=findItem(b.dataset.id),L=cur();
  if(a==='close'){$('ddlg').close();return}
  if(!i)return;
  if(a==='got'){i.got=!i.got;save();render();openDetails(i.id)}
  else if(a==='edit'){$('ddlg').close();lastFetched=i.link||'';openForm(i)}
  else if(a==='del'&&confirm('Excluir “'+i.name+'”?')){L.items=L.items.filter(function(x){return x!==i});save();$('ddlg').close();render()}
});
$('ddlg').addEventListener('click',function(e){if(e.target===$('ddlg'))$('ddlg').close()});
$('list').addEventListener('click',function(e){
  if(e.target.closest('a'))return;
  var c=e.target.closest('.card');if(c)openDetails(c.dataset.id);
});

var editing=null, photoData='', dlg=$('dlg'), lastFetched='';
function showPrev(){var p=$('prev');if(photoData){p.src=photoData;p.style.display='block'}else{p.style.display='none'}}
function setStatus(t,err){var s=$('status');s.textContent=t;s.className='status'+(err?' err':'')}
function openForm(item){
  editing=item||null;photoData=item?item.photo||'':'';
  $('ttl').textContent=item?'Editar presente':'Novo presente';
  $('link').value=item?item.link||'':'';$('name').value=item?item.name:'';$('desc').value=item?item.desc||'':'';
  $('price').value=item&&item.price?item.price:'';$('store').value=item?item.store||'':'';
  $('variant').value=item?item.variant||'':'';$('prio').value=item?item.prio:2;$('notes').value=item?item.notes||'':'';
  $('photo').value='';setStatus('');showPrev();dlg.showModal();
}
function fetchPreview(){
  var link=$('link').value.trim();
  if(!link||link===lastFetched)return;
  try{new URL(link)}catch(e){setStatus('Cole o link completo, começando com https://',true);return}
  lastFetched=link;setStatus('Buscando foto e dados do produto. Pode levar até 20 segundos...');
  fetch('/api/preview?url='+encodeURIComponent(link)).then(function(r){return r.text()}).then(function(t){
    var d;try{d=JSON.parse(t)}catch(e){lastFetched='';setStatus('A função de busca não foi encontrada. Confira se o arquivo api/preview.js está no GitHub e se a Vercel terminou o deploy.',true);return}
    if(d.error){setStatus(d.error+' '+(d.detail||'')+' Preencha manualmente ou envie a foto.',true);return}
    if(d.title)$('name').value=d.title;
    if(d.description)$('desc').value=d.description;
    if(d.price)$('price').value=d.price;
    if(d.store)$('store').value=d.store;
    if(d.image){photoData=d.image;showPrev()}
    setStatus(d.image?'Dados carregados. Confira e salve.':'Dados carregados, mas sem foto. Envie uma abaixo.',!d.image);
  }).catch(function(){lastFetched='';setStatus('Falha de conexão. Tente de novo.',true)});
}
$('fetch').onclick=function(){lastFetched='';fetchPreview()};
$('link').addEventListener('paste',function(){setTimeout(fetchPreview,60)});
$('link').addEventListener('change',fetchPreview);
$('prev').onerror=function(){photoData='';showPrev();setStatus('A foto não carregou. Envie uma manualmente.',true)};
$('photo').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){var img=new Image();img.onload=function(){
    var s=Math.min(1,480/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    photoData=c.toDataURL('image/jpeg',0.72);showPrev()};img.src=r.result};
  r.readAsDataURL(f);
});
$('add').onclick=function(){lastFetched='';openForm(null)};
$('cancel').onclick=function(){dlg.close()};
$('save').onclick=function(){
  var name=$('name').value.trim();if(!name){$('name').focus();return}
  var d={name:name,desc:$('desc').value.trim(),link:$('link').value.trim(),price:$('price').value,store:$('store').value.trim(),variant:$('variant').value.trim(),prio:Number($('prio').value),notes:$('notes').value.trim(),photo:photoData};
  var L=cur();
  if(editing){Object.assign(editing,d)}else{d.id=uid();d.got=false;L.items.push(d)}
  save();dlg.close();render();
};
$('tabs').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  S.active=b.dataset.id;save();render();
});
$('newlist').onclick=function(){$('lname').value='';$('ldlg').showModal()};
$('lcancel').onclick=function(){$('ldlg').close()};
$('lsave').onclick=function(){
  var n=$('lname').value.trim();if(!n)return;
  var l={id:uid(),name:n,emoji:$('lemoji').value||'🎁',items:[]};
  S.lists.push(l);S.active=l.id;save();$('ldlg').close();render();
};
load();render();
</script>
</body>
</html>
