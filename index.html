<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de Presentes</title>
<style>
:root{--bg:#fbf7f4;--card:#fff;--text:#2b2326;--muted:#7b6f73;--accent:#d6456b;--accent-t:#fff;--line:#eadfe0;--chip:#f6e9ec}
@media (prefers-color-scheme:dark){:root{--bg:#171214;--card:#231b1e;--text:#f4eaec;--muted:#a99a9f;--accent:#ee6a8d;--accent-t:#1a0d11;--line:#3a2d31;--chip:#33262b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;font-size:.95rem}
.tab.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0;flex-wrap:wrap}
.stats{color:var(--muted);font-size:.9rem}
button{font:inherit}
.btn{background:var(--accent);color:var(--accent-t);border:0;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card.got{opacity:.55}
.ph{aspect-ratio:4/3;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:2.5rem;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain;background:#fff}
.body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-weight:650}
.price{color:var(--accent);font-weight:700}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:.78rem;color:var(--muted)}
.notes{color:var(--muted);font-size:.88rem;white-space:pre-wrap}
.act{display:flex;gap:6px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.act a,.act button{font-size:.82rem;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;text-decoration:none}
.act a.go{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:50px 10px;border:1px dashed var(--line);border-radius:14px}
dialog{border:0;border-radius:16px;padding:0;background:var(--card);color:var(--text);width:min(460px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
form{padding:18px;display:flex;flex-direction:column;gap:10px}
form h2{margin:0 0 4px;font-size:1.15rem}
label{font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select,textarea{font:inherit;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.linkrow{display:flex;gap:8px}
.linkrow .btn{white-space:nowrap;padding:9px 12px}
.status{font-size:.82rem;color:var(--muted);min-height:1.1em}
.status.err{color:var(--accent)}
.prev{width:100%;max-height:170px;object-fit:contain;border-radius:10px;background:#fff;display:none}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎁 Lista de Presentes</h1>
  <p class="sub">Cole o link do produto e a foto, o nome e o preço entram sozinhos.</p>
  <div class="tabs" id="tabs"></div>
  <div class="bar">
    <div class="stats" id="stats"></div>
    <button class="btn" id="add">+ Adicionar presente</button>
  </div>
  <div id="list"></div>
</div>

<dialog id="dlg">
  <form onsubmit="return false">
    <h2 id="ttl">Novo presente</h2>
    <label>Link do produto
      <div class="linkrow">
        <input id="link" type="url" placeholder="Cole o link aqui">
        <button type="button" class="btn ghost" id="fetch">Buscar</button>
      </div>
    </label>
    <div class="status" id="status"></div>
    <img class="prev" id="prev" alt="">
    <label>Nome do presente *<input id="name" placeholder="Preenchido automaticamente"></label>
    <div class="row">
      <label>Preço (R$)<input id="price" type="number" min="0" step="0.01" inputmode="decimal"></label>
      <label>Loja<input id="store" placeholder="Ex.: Amazon"></label>
    </div>
    <div class="row">
      <label>Tamanho / cor / modelo<input id="variant" placeholder="Ex.: M, preto"></label>
      <label>Prioridade
        <select id="prio"><option value="3">⭐⭐⭐ Quero muito</option><option value="2" selected>⭐⭐ Legal ter</option><option value="1">⭐ Se sobrar</option></select>
      </label>
    </div>
    <label>Observações<textarea id="notes" rows="2" placeholder="Qualquer detalhe que ajude quem for comprar"></textarea></label>
    <label>Trocar foto (opcional)<input id="photo" type="file" accept="image/*"></label>
    <div class="foot">
      <button type="button" class="btn ghost" id="cancel">Cancelar</button>
      <button type="button" class="btn" id="save">Salvar</button>
    </div>
  </form>
</dialog>

<dialog id="ldlg">
  <form onsubmit="return false">
    <h2>Nova lista</h2>
    <label>Nome da lista<input id="lname" placeholder="Ex.: Dia dos Namorados"></label>
    <label>Emoji<input id="lemoji" value="🎁" maxlength="4"></label>
    <div class="foot">
      <button type="button" class="btn ghost" id="lcancel">Cancelar</button>
      <button type="button" class="btn" id="lsave">Criar</button>
    </div>
  </form>
</dialog>

<script>
var KEY='gift-lists-v2', S=null;
function $(id){return document.getElementById(id)}
function uid(){return Math.random().toString(36).slice(2,10)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function load(){
  try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
  if(!S||!S.lists){S={active:null,lists:[
    {id:uid(),name:'Aniversário',emoji:'🎂',items:[]},
    {id:uid(),name:'Aniversário de namoro',emoji:'💕',items:[]},
    {id:uid(),name:'Natal',emoji:'🎄',items:[]}]};S.active=S.lists[0].id}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Armazenamento cheio. Use fotos menores.')}}
function cur(){return S.lists.find(function(l){return l.id===S.active})||S.lists[0]}

function render(){
  var L=cur();S.active=L.id;
  $('tabs').innerHTML=S.lists.map(function(l){return '<button class="tab'+(l.id===L.id?' on':'')+'" data-id="'+l.id+'">'+esc(l.emoji)+' '+esc(l.name)+'</button>'}).join('')+'<button class="tab" id="newlist">+ Nova lista</button>';
  var open=L.items.filter(function(i){return !i.got});
  var total=open.reduce(function(a,i){return a+(Number(i.price)||0)},0);
  $('stats').textContent=L.items.length+' presente(s), '+open.length+' faltando'+(total?', total '+money(total):'');
  var items=L.items.slice().sort(function(a,b){return (a.got-b.got)||(b.prio-a.prio)});
  if(!items.length){$('list').innerHTML='<div class="empty">Nenhum presente em “'+esc(L.name)+'” ainda.<br>Clique em “Adicionar presente” e cole um link.</div>';return}
  $('list').innerHTML='<div class="grid">'+items.map(function(i){
    return '<div class="card'+(i.got?' got':'')+'"><div class="ph">'+(i.photo?'<img src="'+esc(i.photo)+'" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.textContent=\'🎁\'">':'🎁')+'</div><div class="body">'
    +'<div class="name">'+esc(i.name)+'</div>'
    +(i.price?'<div class="price">'+money(i.price)+'</div>':'')
    +'<div class="meta"><span class="chip">'+'⭐'.repeat(i.prio)+'</span>'+(i.store?'<span class="chip">'+esc(i.store)+'</span>':'')+(i.variant?'<span class="chip">'+esc(i.variant)+'</span>':'')+(i.got?'<span class="chip">✓ já ganhei</span>':'')+'</div>'
    +(i.notes?'<div class="notes">'+esc(i.notes)+'</div>':'')
    +'<div class="act">'+(i.link?'<a class="go" href="'+esc(i.link)+'" target="_blank" rel="noopener noreferrer">Ver produto</a>':'')
    +'<button data-a="got" data-id="'+i.id+'">'+(i.got?'Desmarcar':'Já ganhei')+'</button>'
    +'<button data-a="edit" data-id="'+i.id+'">Editar</button>'
    +'<button data-a="del" data-id="'+i.id+'">Excluir</button></div></div></div>'}).join('')+'</div>';
}

var editing=null, photoData='', dlg=$('dlg');
function showPrev(){var p=$('prev');if(photoData){p.src=photoData;p.style.display='block'}else{p.style.display='none'}}
function setStatus(t,err){var s=$('status');s.textContent=t;s.className='status'+(err?' err':'')}
function openForm(item){
  editing=item||null;photoData=item?item.photo||'':'';
  $('ttl').textContent=item?'Editar presente':'Novo presente';
  $('link').value=item?item.link||'':'';$('name').value=item?item.name:'';
  $('price').value=item&&item.price?item.price:'';$('store').value=item?item.store||'':'';
  $('variant').value=item?item.variant||'':'';$('prio').value=item?item.prio:2;$('notes').value=item?item.notes||'':'';
  $('photo').value='';setStatus('');showPrev();dlg.showModal();
}

var lastFetched='';
function fetchPreview(){
  var link=$('link').value.trim();
  if(!link||link===lastFetched)return;
  try{new URL(link)}catch(e){setStatus('Cole um link completo, começando com https://',true);return}
  lastFetched=link;setStatus('Buscando foto e dados do produto...');
  fetch('/api/preview?url='+encodeURIComponent(link)).then(function(r){return r.json()}).then(function(d){
    if(d.error){setStatus(d.error+' Preencha manualmente ou envie a foto.',true);return}
    if(d.title)$('name').value=d.title;
    if(d.price)$('price').value=d.price;
    if(d.store)$('store').value=d.store;
    if(d.image){photoData=d.image;showPrev()}
    setStatus(d.image?'Dados carregados. Confira e salve.':'Dados carregados, mas sem foto. Você pode enviar uma abaixo.',!d.image);
  }).catch(function(){lastFetched='';setStatus('Falha na busca. Tente de novo.',true)});
}
$('fetch').onclick=function(){lastFetched='';fetchPreview()};
$('link').addEventListener('paste',function(){setTimeout(fetchPreview,60)});
$('link').addEventListener('change',fetchPreview);
$('prev').onerror=function(){photoData='';showPrev();setStatus('A foto não carregou. Envie uma manualmente.',true)};

$('photo').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){var img=new Image();img.onload=function(){
    var s=Math.min(1,480/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    photoData=c.toDataURL('image/jpeg',0.72);showPrev()};img.src=r.result};
  r.readAsDataURL(f);
});
$('add').onclick=function(){lastFetched='';openForm(null)};
$('cancel').onclick=function(){dlg.close()};
$('save').onclick=function(){
  var name=$('name').value.trim();if(!name){$('name').focus();return}
  var d={name:name,link:$('link').value.trim(),price:$('price').value,store:$('store').value.trim(),variant:$('variant').value.trim(),prio:Number($('prio').value),notes:$('notes').value.trim(),photo:photoData};
  var L=cur();
  if(editing){Object.assign(editing,d)}else{d.id=uid();d.got=false;L.items.push(d)}
  save();dlg.close();render();
};
$('list').addEventListener('click',function(e){
  var b=e.target.closest('button[data-a]');if(!b)return;
  var L=cur(),it=L.items.find(function(x){return x.id===b.dataset.id});if(!it)return;
  if(b.dataset.a==='got'){it.got=!it.got;save();render()}
  else if(b.dataset.a==='edit'){lastFetched=it.link||'';openForm(it)}
  else if(b.dataset.a==='del'&&confirm('Excluir “'+it.name+'”?')){L.items=L.items.filter(function(x){return x!==it});save();render()}
});
$('tabs').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.id==='newlist'){$('lname').value='';$('ldlg').showModal();return}
  S.active=b.dataset.id;save();render();
});
$('lcancel').onclick=function(){$('ldlg').close()};
$('lsave').onclick=function(){
  var n=$('lname').value.trim();if(!n)return;
  var l={id:uid(),name:n,emoji:$('lemoji').value||'🎁',items:[]};
  S.lists.push(l);S.active=l.id;save();$('ldlg').close();render();
};
load();render();
</script>
</body>
</html>
