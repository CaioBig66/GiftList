<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus Presentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--p:#6d3aea;--pd:#4c22b8;--ink:#241449;--muted:#7d73a0;--lav:#f3eeff;--lav2:#faf8ff;--line:#e9e2fa;--white:#fff;
--head:"Bricolage Grotesque",system-ui,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--white);color:var(--ink);font-family:var(--body);line-height:1.45}
button,input,select,textarea{font:inherit}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:var(--lav2);border-right:1px solid var(--line);padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{font-family:var(--head);font-weight:800;font-size:1.4rem;color:var(--p);display:flex;gap:8px;align-items:center}
#tabs{display:flex;flex-direction:column;gap:6px}
.tab{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);padding:11px 14px;border-radius:12px;cursor:pointer;text-align:left;font-weight:500}
.tab:hover{background:var(--lav)}
.tab.on{background:var(--p);color:#fff;box-shadow:0 8px 18px rgba(109,58,234,.28)}
.tab small{background:rgba(109,58,234,.12);color:var(--pd);border-radius:999px;padding:1px 9px;font-weight:600}
.tab.on small{background:rgba(255,255,255,.25);color:#fff}
.newlist{border:1.5px dashed #c9b8f5;background:transparent;color:var(--p);padding:11px;border-radius:12px;cursor:pointer;font-weight:600}
.newlist:hover{background:var(--lav)}
main{padding:34px clamp(18px,4vw,48px) 90px;max-width:1100px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
h1{font-family:var(--head);font-weight:800;font-size:clamp(1.9rem,4vw,2.7rem);line-height:1.05;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);margin:6px 0 0}
.btn{background:var(--p);color:#fff;border:0;padding:12px 20px;border-radius:14px;cursor:pointer;font-weight:600;box-shadow:0 8px 18px rgba(109,58,234,.25)}
.btn:hover{background:var(--pd)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--lav)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px 0}
.stat{background:var(--lav);border-radius:18px;padding:14px 18px}
.stat b{display:block;font-family:var(--head);font-size:1.6rem;color:var(--pd)}
.stat span{color:var(--muted);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 28px rgba(109,58,234,.07)}
.ph{position:relative;aspect-ratio:1/1;background:var(--lav);display:flex;align-items:center;justify-content:center;font-size:3rem}
.ph img{width:100%;height:100%;object-fit:contain;background:#fff}
.got .ph img{filter:grayscale(1);opacity:.55}
.pill{position:absolute;font-size:.8rem;font-weight:600;border-radius:999px;padding:4px 12px}
.pill.price{left:12px;bottom:12px;background:var(--p);color:#fff;font-size:.95rem}
.pill.star{right:12px;top:12px;background:#fff;color:var(--pd);box-shadow:0 4px 12px rgba(36,20,73,.12)}
.pill.done{left:12px;top:12px;background:var(--ink);color:#fff}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.name{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--lav);border-radius:999px;padding:2px 10px;font-size:.78rem;color:var(--pd)}
.notes{color:var(--muted);font-size:.88rem;white-space:pre-wrap}
.act{display:flex;gap:6px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.act a,.act button{font-size:.82rem;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-decoration:none;font-weight:500}
.act a.go{background:var(--p);color:#fff;border-color:var(--p)}
.act button:hover{background:var(--lav)}
.empty{text-align:center;color:var(--muted);padding:56px 14px;border:1.5px dashed #d6c9f7;border-radius:22px;background:var(--lav2)}
dialog{border:0;border-radius:24px;padding:0;background:#fff;color:var(--ink);width:min(480px,94vw);max-height:92vh;box-shadow:0 30px 80px rgba(36,20,73,.3)}
dialog::backdrop{background:rgba(36,20,73,.45)}
form{padding:22px;display:flex;flex-direction:column;gap:12px}
form h2{margin:0;font-family:var(--head);font-size:1.4rem}
label{font-size:.84rem;color:var(--muted);display:flex;flex-direction:column;gap:5px;font-weight:500}
input,select,textarea{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--lav2);color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--p);outline-offset:0;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.linkrow{display:flex;gap:8px}
.linkrow .btn{padding:10px 16px;white-space:nowrap;box-shadow:none}
.status{font-size:.84rem;color:var(--muted);min-height:1.2em}
.status.err{color:#c2255c}
.prev{width:100%;max-height:180px;object-fit:contain;border-radius:14px;background:var(--lav);display:none}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
@media (max-width:820px){
 .app{grid-template-columns:1fr}
 .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px 14px}
 #tabs{flex-direction:row;overflow-x:auto;padding-bottom:4px}
 .tab{white-space:nowrap}
 .newlist{align-self:flex-start;padding:8px 14px}
 .stats{grid-template-columns:repeat(3,1fr)}
 .stat{padding:10px 12px}.stat b{font-size:1.2rem}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">🎁 Meus Presentes</div>
    <nav id="tabs"></nav>
    <button class="newlist" id="newlist">+ Nova lista</button>
  </aside>
  <main>
    <div class="head">
      <div><h1 id="lt"></h1><p class="sub">Cole o link e a foto, o nome e o preço entram sozinhos.</p></div>
      <button class="btn" id="add">+ Adicionar presente</button>
    </div>
    <div class="stats" id="stats"></div>
    <div id="list"></div>
  </main>
</div>

<dialog id="dlg">
  <form onsubmit="return false">
    <h2 id="ttl">Novo presente</h2>
    <label>Link do produto
      <div class="linkrow">
        <input id="link" type="url" placeholder="Cole o link aqui">
        <button type="button" class="btn" id="fetch">Buscar</button>
      </div>
    </label>
    <div class="status" id="status"></div>
    <img class="prev" id="prev" alt="">
    <label>Nome do presente *<input id="name" placeholder="Preenchido automaticamente"></label>
    <div class="row">
      <label>Preço (R$)<input id="price" type="number" min="0" step="0.01" inputmode="decimal"></label>
      <label>Loja<input id="store" placeholder="Ex.: Amazon"></label>
    </div>
    <div class="row">
      <label>Tamanho, cor ou modelo<input id="variant" placeholder="Ex.: M, preto"></label>
      <label>Prioridade
        <select id="prio"><option value="3">⭐⭐⭐ Quero muito</option><option value="2" selected>⭐⭐ Legal ter</option><option value="1">⭐ Se sobrar</option></select>
      </label>
    </div>
    <label>Observações<textarea id="notes" rows="2" placeholder="Qualquer detalhe que ajude quem for comprar"></textarea></label>
    <label>Trocar foto (opcional)<input id="photo" type="file" accept="image/*"></label>
    <div class="foot">
      <button type="button" class="btn ghost" id="cancel">Cancelar</button>
      <button type="button" class="btn" id="save">Salvar</button>
    </div>
  </form>
</dialog>

<dialog id="ldlg">
  <form onsubmit="return false">
    <h2>Nova lista</h2>
    <label>Nome da lista<input id="lname" placeholder="Ex.: Dia dos Namorados"></label>
    <label>Emoji<input id="lemoji" value="🎁" maxlength="4"></label>
    <div class="foot">
      <button type="button" class="btn ghost" id="lcancel">Cancelar</button>
      <button type="button" class="btn" id="lsave">Criar lista</button>
    </div>
  </form>
</dialog>

<script>
var KEY='gift-lists-v2', S=null;
function $(id){return document.getElementById(id)}
function uid(){return Math.random().toString(36).slice(2,10)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function load(){
  try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
  if(!S||!S.lists){S={active:null,lists:[
    {id:uid(),name:'Aniversário',emoji:'🎂',items:[]},
    {id:uid(),name:'Aniversário de namoro',emoji:'💕',items:[]},
    {id:uid(),name:'Natal',emoji:'🎄',items:[]}]};S.active=S.lists[0].id}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Armazenamento cheio. Use fotos menores.')}}
function cur(){return S.lists.find(function(l){return l.id===S.active})||S.lists[0]}

function render(){
  var L=cur();S.active=L.id;
  $('tabs').innerHTML=S.lists.map(function(l){return '<button class="tab'+(l.id===L.id?' on':'')+'" data-id="'+l.id+'"><span>'+esc(l.emoji)+' '+esc(l.name)+'</span><small>'+l.items.length+'</small></button>'}).join('');
  $('lt').textContent=L.emoji+' '+L.name;
  var open=L.items.filter(function(i){return !i.got});
  var total=open.reduce(function(a,i){return a+(Number(i.price)||0)},0);
  $('stats').innerHTML='<div class="stat"><b>'+L.items.length+'</b><span>presentes</span></div><div class="stat"><b>'+open.length+'</b><span>faltando ganhar</span></div><div class="stat"><b>'+money(total)+'</b><span>valor do que falta</span></div>';
  var items=L.items.slice().sort(function(a,b){return (a.got-b.got)||(b.prio-a.prio)});
  if(!items.length){$('list').innerHTML='<div class="empty">Nenhum presente em “'+esc(L.name)+'” ainda.<br>Clique em “Adicionar presente” e cole um link.</div>';return}
  $('list').innerHTML='<div class="grid">'+items.map(function(i){
    return '<div class="card'+(i.got?' got':'')+'"><div class="ph">'+(i.photo?'<img src="'+esc(i.photo)+'" alt="" referrerpolicy="no-referrer" onerror="this.outerHTML=\'🎁\'">':'🎁')
    +(i.price?'<span class="pill price">'+money(i.price)+'</span>':'')+'<span class="pill star">'+'⭐'.repeat(i.prio)+'</span>'+(i.got?'<span class="pill done">Já ganhei</span>':'')+'</div><div class="body">'
    +'<div class="name">'+esc(i.name)+'</div>'
    +((i.store||i.variant)?'<div class="meta">'+(i.store?'<span class="chip">'+esc(i.store)+'</span>':'')+(i.variant?'<span class="chip">'+esc(i.variant)+'</span>':'')+'</div>':'')
    +(i.notes?'<div class="notes">'+esc(i.notes)+'</div>':'')
    +'<div class="act">'+(i.link?'<a class="go" href="'+esc(i.link)+'" target="_blank" rel="noopener noreferrer">Ver produto</a>':'')
    +'<button data-a="got" data-id="'+i.id+'">'+(i.got?'Desmarcar':'Já ganhei')+'</button>'
    +'<button data-a="edit" data-id="'+i.id+'">Editar</button>'
    +'<button data-a="del" data-id="'+i.id+'">Excluir</button></div></div></div>'}).join('')+'</div>';
}

var editing=null, photoData='', dlg=$('dlg'), lastFetched='';
function showPrev(){var p=$('prev');if(photoData){p.src=photoData;p.style.display='block'}else{p.style.display='none'}}
function setStatus(t,err){var s=$('status');s.textContent=t;s.className='status'+(err?' err':'')}
function openForm(item){
  editing=item||null;photoData=item?item.photo||'':'';
  $('ttl').textContent=item?'Editar presente':'Novo presente';
  $('link').value=item?item.link||'':'';$('name').value=item?item.name:'';
  $('price').value=item&&item.price?item.price:'';$('store').value=item?item.store||'':'';
  $('variant').value=item?item.variant||'':'';$('prio').value=item?item.prio:2;$('notes').value=item?item.notes||'':'';
  $('photo').value='';setStatus('');showPrev();dlg.showModal();
}
function fetchPreview(){
  var link=$('link').value.trim();
  if(!link||link===lastFetched)return;
  try{new URL(link)}catch(e){setStatus('Cole o link completo, começando com https://',true);return}
  lastFetched=link;setStatus('Buscando foto e dados do produto. Pode levar até 20 segundos...');
  fetch('/api/preview?url='+encodeURIComponent(link)).then(function(r){return r.text()}).then(function(t){
    var d;try{d=JSON.parse(t)}catch(e){lastFetched='';setStatus('A função de busca não foi encontrada. Confira se o arquivo api/preview.js está no GitHub e se a Vercel terminou o deploy.',true);return}
    if(d.error){setStatus(d.error+' '+(d.detail||'')+' Preencha manualmente ou envie a foto.',true);return}
    if(d.title)$('name').value=d.title;
    if(d.price)$('price').value=d.price;
    if(d.store)$('store').value=d.store;
    if(d.image){photoData=d.image;showPrev()}
    setStatus(d.image?'Dados carregados. Confira e salve.':'Dados carregados, mas sem foto. Envie uma abaixo.',!d.image);
  }).catch(function(){lastFetched='';setStatus('Falha de conexão. Tente de novo.',true)});
}
$('fetch').onclick=function(){lastFetched='';fetchPreview()};
$('link').addEventListener('paste',function(){setTimeout(fetchPreview,60)});
$('link').addEventListener('change',fetchPreview);
$('prev').onerror=function(){photoData='';showPrev();setStatus('A foto não carregou. Envie uma manualmente.',true)};
$('photo').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){var img=new Image();img.onload=function(){
    var s=Math.min(1,480/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    photoData=c.toDataURL('image/jpeg',0.72);showPrev()};img.src=r.result};
  r.readAsDataURL(f);
});
$('add').onclick=function(){lastFetched='';openForm(null)};
$('cancel').onclick=function(){dlg.close()};
$('save').onclick=function(){
  var name=$('name').value.trim();if(!name){$('name').focus();return}
  var d={name:name,link:$('link').value.trim(),price:$('price').value,store:$('store').value.trim(),variant:$('variant').value.trim(),prio:Number($('prio').value),notes:$('notes').value.trim(),photo:photoData};
  var L=cur();
  if(editing){Object.assign(editing,d)}else{d.id=uid();d.got=false;L.items.push(d)}
  save();dlg.close();render();
};
$('list').addEventListener('click',function(e){
  var b=e.target.closest('button[data-a]');if(!b)return;
  var L=cur(),it=L.items.find(function(x){return x.id===b.dataset.id});if(!it)return;
  if(b.dataset.a==='got'){it.got=!it.got;save();render()}
  else if(b.dataset.a==='edit'){lastFetched=it.link||'';openForm(it)}
  else if(b.dataset.a==='del'&&confirm('Excluir “'+it.name+'”?')){L.items=L.items.filter(function(x){return x!==it});save();render()}
});
$('tabs').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  S.active=b.dataset.id;save();render();
});
$('newlist').onclick=function(){$('lname').value='';$('ldlg').showModal()};
$('lcancel').onclick=function(){$('ldlg').close()};
$('lsave').onclick=function(){
  var n=$('lname').value.trim();if(!n)return;
  var l={id:uid(),name:n,emoji:$('lemoji').value||'🎁',items:[]};
  S.lists.push(l);S.active=l.id;save();$('ldlg').close();render();
};
load();render();
</script>
</body>
</html>
